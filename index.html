<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Caption Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Bebas+Neue&family=Dancing+Script:wght@700&family=Great+Vibes&family=Montserrat:ital,wght@0,800;0,900;1,900&family=Pacifico&family=Noto+Sans+Tamil:wght@800&family=Noto+Sans+Devanagari:wght@800&display=swap" rel="stylesheet">
<style>
:root{--bg:#13131a;--card:#1f1f29;--line:#32323f;--ink:#f3f3f7;--mute:#9b9bab;--acc:#ffb020}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,sans-serif;padding:14px;max-width:600px;margin-inline:auto}
h1{font-size:20px;margin:4px 0 12px}
h2{font-size:14px;margin:0 0 10px;color:var(--mute);font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:10px 0}
label{display:block;font-size:12px;color:var(--mute)}
input,select,button{font:inherit;color:var(--ink);background:#15151d;border:1px solid var(--line);border-radius:10px;padding:9px;width:100%;min-width:0}
button{cursor:pointer;width:auto}
button.main{background:var(--acc);color:#1a1200;border:0;font-weight:700}
button:disabled{opacity:.45;cursor:default}
:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
input[type=range]{padding:0;height:28px;accent-color:var(--acc);border:0;background:none}
input[type=color]{padding:2px;height:34px}
canvas#cv{width:100%;max-height:62vh;object-fit:contain;background:#000;border-radius:12px;display:block}
video{display:none}
#st{color:var(--mute);min-height:20px;margin-top:8px;font-size:13px}
progress{width:100%;height:8px;margin-top:8px;accent-color:var(--acc)}
.bar{display:flex;gap:8px;align-items:center;margin-top:8px}
.bar .main,.bar button{flex:1}
#tm{font-size:12px;color:var(--mute);white-space:nowrap}
#tp{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;scroll-snap-type:x proximity}
.th{padding:3px;scroll-snap-align:start;flex:none}
.th.on{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc)}
.th canvas{width:150px;height:73px;display:block;border-radius:8px}
.tune{display:grid;grid-template-columns:1fr 1fr;gap:8px 12px}
.chk{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--ink)}
.chk input{width:auto}
#list{max-height:340px;overflow-y:auto}
.r{display:grid;grid-template-columns:64px 1fr 38px;gap:6px;margin-bottom:6px}
.r button{padding:8px 4px;font-size:12px}
.r.act input{border-color:var(--acc)}
.empty{color:var(--mute);font-size:13px}
</style>
</head>
<body>
<h1>Caption Studio</h1>

<section class="card">
  <input type="file" id="file" accept="video/*" aria-label="Choose a video">
  <div class="grid">
    <label>Language
      <select id="lang">
        <option value="">Auto-detect</option>
        <option value="english">English</option><option value="tamil">Tamil</option>
        <option value="hindi">Hindi</option><option value="telugu">Telugu</option>
        <option value="malayalam">Malayalam</option><option value="kannada">Kannada</option>
        <option value="bengali">Bengali</option><option value="marathi">Marathi</option>
        <option value="urdu">Urdu</option><option value="arabic">Arabic</option>
        <option value="spanish">Spanish</option><option value="french">French</option>
      </select>
    </label>
    <label>Accuracy
      <select id="acc">
        <option value="Xenova/whisper-base">Fast</option>
        <option value="Xenova/whisper-small" selected>Accurate</option>
      </select>
    </label>
    <label>Words per caption
      <select id="wpc"><option>2</option><option>3</option><option selected>4</option><option>5</option><option>6</option></select>
    </label>
  </div>
  <button class="main" id="go" disabled style="width:100%">Generate captions</button>
  <progress id="pr" max="100" hidden></progress>
  <div id="st">Choose a video to start. Pick the spoken language for the best accuracy.</div>
</section>

<canvas id="cv" width="360" height="640"></canvas>
<video id="v" playsinline></video>
<div class="bar">
  <button id="play" disabled>Play</button>
  <input type="range" id="seek" min="0" max="1000" value="0" aria-label="Seek" style="flex:4">
  <span id="tm">0:00</span>
</div>

<section class="card" style="margin-top:12px">
  <h2>Caption style</h2>
  <div id="tp" role="group" aria-label="Caption style"></div>
</section>

<section class="card">
  <h2>Adjust</h2>
  <div class="tune">
    <label>Size <input type="range" id="size" min="60" max="160" value="100"></label>
    <label>Height <input type="range" id="pos" min="35" max="92" value="72"></label>
    <label>Timing shift (sec) <input type="range" id="delay" min="-100" max="100" value="0"></label>
    <label>Highlight color <input type="color" id="hlc" value="#ffe600"></label>
    <label class="chk"><input type="checkbox" id="up"> Uppercase</label>
    <label class="chk"><input type="checkbox" id="hl"> Highlight spoken word</label>
  </div>
</section>

<section class="card">
  <h2>Edit captions (fix any wrong words)</h2>
  <div id="list"><div class="empty">Captions will appear here after you generate them.</div></div>
</section>

<div class="bar">
  <button class="main" id="exp" disabled>Export video</button>
  <button id="srt" disabled>Download SRT</button>
</div>

<script type="module">
import {pipeline} from 'https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.0.2';

const $=id=>document.getElementById(id);
const v=$('v'),cv=$('cv'),g=cv.getContext('2d');
let W=cv.width,H=cv.height,words=[],chunks=[],asr,asrModel,ac,dest,sel=0,lastAct=-1;
const S={size:1,pos:72,up:false,hl:false,hlc:'#ffe600',delay:0,wpc:4};
const status=t=>$('st').textContent=t;

/* ---------- Caption styles (add your own here) ----------
   a = first line, b = second line
   f = font, c = colour or array of colours (gradient), d:'h' = horizontal gradient,
   o = outline colour, g = glow colour, s = size multiplier, up = force uppercase */
const FB=',"Noto Sans Tamil","Noto Sans Devanagari",sans-serif';
const f=(fam,w=400,it='')=>p=>`${it} ${w} ${p}px "${fam}"${FB}`;
const T=[
 {n:'Gold Impact',  a:{f:f('Bebas Neue'),c:'#fff',up:1,s:1.1}, b:{f:f('Montserrat',900,'italic'),c:['#7a5a08','#ffe27a','#b8860b'],s:1.1,up:1}},
 {n:'Sunset Script',a:{f:f('Montserrat',900),c:['#ff6a00','#ffb347'],s:1.1}, b:{f:f('Dancing Script',700),c:['#fff','#8a8a95'],s:1.25}},
 {n:'Neon Emerald', a:{f:f('Anton'),c:['#00ff2a','#0c9a28'],up:1,g:'#00ff2a'}, b:{f:f('Montserrat',800),c:'#fff',up:1,s:.9}},
 {n:'Sapphire Script',a:{f:f('Great Vibes'),c:['#58a0ff','#1f3dff'],s:1.4}, b:{f:f('Montserrat',800),c:'#fff',up:1,s:.85}},
 {n:'Lime Drop',    a:{f:f('Montserrat',900),c:'#fff',up:1,s:.95}, b:{f:f('Montserrat',900),c:['#c8ff4a','#4f9a10'],up:1,s:1.15}},
 {n:'Ocean Brush',  a:{f:f('Pacifico'),c:['#35c0ff','#0b3dff'],s:.95}, b:{f:f('Pacifico'),c:'#fff',s:.8}},
 {n:'Classic Gold', a:{f:f('Bebas Neue'),c:['#a67c00','#fff0a8','#c89b10'],up:1,s:1.2}, b:{f:f('Montserrat',800),c:'#fff',up:1,s:.8}},
 {n:'Fire Blaze',   a:{f:f('Anton'),c:['#fff200','#ff7a00','#e0120a'],up:1,o:'#2a0500',g:'#ff5a00'}, b:{f:f('Anton'),c:'#fff',up:1,s:.85,o:'#2a0500'}},
 {n:'Candy Pop',    a:{f:f('Montserrat',900),c:['#ff3cac','#784ba0','#2b86c5'],d:'h',up:1,s:1.05}, b:{f:f('Montserrat',800),c:'#fff',up:1,s:.85}},
 {n:'Chrome',       a:{f:f('Bebas Neue'),c:['#fff','#8f99ab','#f4f6fa','#5d6676'],up:1,s:1.25}, b:{f:f('Bebas Neue'),c:'#fff',up:1,s:.95}},
 {n:'Rainbow',      a:{f:f('Anton'),c:['#ff2a2a','#ff9a00','#ffee00','#22dd44','#00b7ff','#8a2be2'],d:'h',up:1,o:'#111'}, b:{f:f('Montserrat',800),c:'#fff',up:1,s:.85}},
 {n:'Cyan Glow',    a:{f:f('Montserrat',900),c:['#b8fffb','#00e5ff'],up:1,g:'#00e5ff'}, b:{f:f('Montserrat',800),c:'#fff',up:1,s:.85}},
 {n:'Rose Gold',    a:{f:f('Great Vibes'),c:['#fbd9cc','#e8a089','#f7c1b0'],s:1.4}, b:{f:f('Montserrat',800),c:'#fff',up:1,s:.85}},
 {n:'Subtitle Yellow',a:{f:f('Anton'),c:'#ffe600',up:1,o:'#000'}, b:{f:f('Anton'),c:'#fff',up:1,o:'#000',s:.9}},
 {n:'Ice Mint',     a:{f:f('Montserrat',900),c:['#e6fffb','#5eead4','#06b6d4'],up:1}, b:{f:f('Montserrat',800),c:'#fff',up:1,s:.85}},
 {n:'Royal Purple', a:{f:f('Pacifico'),c:['#d8a8ff','#7c3aed']}, b:{f:f('Pacifico'),c:'#fff',s:.8}},
 {n:'Hot Red',      a:{f:f('Anton'),c:'#fff',up:1}, b:{f:f('Anton'),c:['#ff7a7a','#d10000'],up:1,s:1.15,o:'#300'}},
 {n:'Sunrise',      a:{f:f('Montserrat',900),c:['#ffd200','#f7971e','#ff512f'],d:'h',up:1}, b:{f:f('Dancing Script',700),c:'#fff',s:1.25}}
];

/* ---------- drawing ---------- */
function drawLine(c2,ws,cx,y,L,base,maxW,act){
  if(!ws.length)return 0;
  const tx=ws.map(w=>(L.up||S.up)?w.t.toUpperCase():w.t),full=tx.join(' ');
  let px=base*(L.s||1);c2.font=L.f(px);
  let w=c2.measureText(full).width;
  if(w>maxW){px*=maxW/w;c2.font=L.f(px);w=maxW}
  c2.textAlign='left';c2.textBaseline='alphabetic';c2.lineJoin='round';
  const x0=cx-w/2;let fill=L.c;
  if(Array.isArray(L.c)){
    const gr=L.d==='h'?c2.createLinearGradient(x0,0,x0+w,0):c2.createLinearGradient(0,y-px*.85,0,y+px*.12);
    L.c.forEach((col,i)=>gr.addColorStop(i/(L.c.length-1),col));fill=gr;
  }
  tx.forEach((t,i)=>{
    const x=x0+(i?c2.measureText(tx.slice(0,i).join(' ')+' ').width:0);
    if(L.o){c2.shadowColor='transparent';c2.lineWidth=px*.14;c2.strokeStyle=L.o;c2.strokeText(t,x,y)}
    if(L.g){c2.shadowColor=L.g;c2.shadowBlur=px*.4;c2.shadowOffsetY=0}
    else{c2.shadowColor='rgba(0,0,0,.85)';c2.shadowBlur=px*.18;c2.shadowOffsetY=px*.05}
    c2.fillStyle=(S.hl&&i===act)?S.hlc:fill;c2.fillText(t,x,y);
  });
  c2.shadowColor='transparent';
  return px;
}
function drawCaption(c2,ws,w,h,tpl,act){
  const n=ws.length,k=n>1?Math.ceil(n/2):0,base=w*.085*S.size,y1=h*S.pos/100;
  const p1=k?drawLine(c2,ws.slice(0,k),w/2,y1,tpl.a,base,w*.92,act):0;
  drawLine(c2,ws.slice(k),w/2,y1+(p1?p1*1.1:0),tpl.b,base,w*.92,act-k);
}
const cur=()=>{const t=v.currentTime-S.delay;return chunks.find(c=>t>=c.s&&t<=c.e)};
function frame(){
  g.shadowColor='transparent';g.drawImage(v,0,0,W,H);
  const c=cur();if(!c)return;
  let act=-1;const t=v.currentTime-S.delay;c.ws.forEach((w,i)=>{if(t>=w.s)act=i});
  drawCaption(g,c.ws,W,H,T[sel],act);
}
const mmss=s=>`${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,'0')}`;
(function loop(){
  if(v.videoWidth){
    frame();
    if(document.activeElement!==$('seek')&&v.duration)$('seek').value=v.currentTime/v.duration*1000;
    $('tm').textContent=`${mmss(v.currentTime)} / ${mmss(v.duration||0)}`;
    $('play').textContent=v.paused?'Play':'Pause';
    const c=cur(),i=c?chunks.indexOf(c):-1;
    if(i!==lastAct){const L=$('list').children;if(L[lastAct])L[lastAct].classList.remove('act');if(L[i])L[i].classList.add('act');lastAct=i}
  }
  requestAnimationFrame(loop);
})();

/* ---------- style thumbnails (each button shows the real style) ---------- */
const FONTS=['Anton','Bebas Neue','Montserrat','Dancing Script','Great Vibes','Pacifico'];
function renderThumbs(){
  const box=$('tp');box.innerHTML='';
  T.forEach((t,i)=>{
    const b=document.createElement('button');b.className='th'+(i===sel?' on':'');b.title=t.n;b.setAttribute('aria-label',t.n);
    const c=document.createElement('canvas');c.width=300;c.height=146;
    const x=c.getContext('2d'),bg=x.createLinearGradient(0,0,0,146);bg.addColorStop(0,'#2a2a36');bg.addColorStop(1,'#14141b');
    x.fillStyle=bg;x.fillRect(0,0,300,146);
    const keep=S.hl;S.hl=false;
    drawCaption(x,[{t:'Your'},{t:'Caption'}],300,146,t,-1);
    S.hl=keep;
    b.append(c);b.onclick=()=>{sel=i;[...box.children].forEach((e,j)=>e.classList.toggle('on',j===i))};
    box.append(b);
  });
}
async function loadFonts(){
  if(document.readyState!=='complete')await new Promise(r=>addEventListener('load',r));
  await Promise.all([...FONTS.map(n=>document.fonts.load(`40px "${n}"`,'Aa')),
    document.fonts.load('800 40px "Noto Sans Tamil"','தமிழ்'),document.fonts.load('800 40px "Noto Sans Devanagari"','हिन्दी')]);
  await document.fonts.ready;renderThumbs();
}
renderThumbs();loadFonts();
$('up').onchange=e=>{S.up=e.target.checked;renderThumbs()};

/* ---------- controls ---------- */
$('size').oninput=e=>S.size=e.target.value/100;
$('pos').oninput=e=>S.pos=+e.target.value;
$('delay').oninput=e=>{S.delay=e.target.value/100;status(`Timing shift: ${S.delay>0?'+':''}${S.delay.toFixed(2)} s`)};
$('hlc').oninput=e=>S.hlc=e.target.value;
$('hl').onchange=e=>S.hl=e.target.checked;
$('wpc').onchange=e=>{S.wpc=+e.target.value;if(words.length){build();renderList();status('Captions re-split. Manual edits were reset.')}};
$('seek').oninput=e=>{if(v.duration)v.currentTime=e.target.value/1000*v.duration};

/* ---------- load video ---------- */
$('file').onchange=e=>{
  const file=e.target.files[0];if(!file)return;
  v.src=URL.createObjectURL(file);
  v.onloadedmetadata=()=>{
    const s=Math.min(1,1280/Math.max(v.videoWidth,v.videoHeight));
    W=cv.width=Math.round(v.videoWidth*s/2)*2;H=cv.height=Math.round(v.videoHeight*s/2)*2;
    v.currentTime=.01;$('go').disabled=false;$('play').disabled=false;
    words=[];chunks=[];renderList();$('exp').disabled=true;$('srt').disabled=true;
    status('Video ready. Choose the language, then tap Generate captions.');
  };
};

/* ---------- transcription (on-device Whisper) ---------- */
async function prepAudio(file){
  const a=new AudioContext({sampleRate:16000});
  const buf=await a.decodeAudioData(await file.arrayBuffer());
  const n=buf.length,out=new Float32Array(n),ch=buf.numberOfChannels;
  for(let c=0;c<ch;c++){const d=buf.getChannelData(c);for(let i=0;i<n;i++)out[i]+=d[i]/ch}   // mix all channels
  let peak=0;for(let i=0;i<n;i++){const x=Math.abs(out[i]);if(x>peak)peak=x}
  if(peak>0&&peak<.9){const k=Math.min(.9/peak,10);for(let i=0;i<n;i++)out[i]*=k}              // normalise quiet audio
  a.close();return out;
}
async function getAsr(model){
  if(asr&&asrModel===model)return asr;
  $('pr').hidden=false;
  asr=await pipeline('automatic-speech-recognition',model,{progress_callback:p=>{
    if(p.status==='progress'){$('pr').value=p.progress;status(`Downloading speech model… ${Math.round(p.progress)}% (first time only)`)}
  }});
  asrModel=model;return asr;
}
async function transcribe(audio,lang){
  const o={chunk_length_s:30,stride_length_s:5,task:'transcribe',...(lang?{language:lang}:{})};
  try{
    const r=await asr(audio,{...o,return_timestamps:'word'});
    return r.chunks.map(c=>({t:c.text.trim(),s:c.timestamp[0],e:c.timestamp[1]}));
  }catch(err){
    console.warn('Word timestamps failed, falling back to segments',err);
    const r=await asr(audio,{...o,return_timestamps:true}),out=[];
    r.chunks.forEach(c=>{
      const ws=c.text.trim().split(/\s+/).filter(Boolean),a=c.timestamp[0],b=c.timestamp[1]??a+ws.length*.4,d=(b-a)/Math.max(ws.length,1);
      ws.forEach((t,i)=>out.push({t,s:a+i*d,e:a+(i+1)*d}));
    });
    return out;
  }
}
function clean(ws){
  ws=ws.filter(w=>w.t&&!/^[\[(].*[\])]$/.test(w.t));          // drop [Music] (noise) tags
  let last=0;
  ws.forEach(w=>{
    if(w.s==null)w.s=last;
    if(w.s<last)w.s=last;
    if(w.e==null||w.e<=w.s)w.e=w.s+.3;
    if(w.e-w.s>1.2)w.e=w.s+.6;                                  // long silences are not speech
    last=w.s;
  });
  return ws.filter((w,i)=>!(i>=3&&ws[i-1].t===w.t&&ws[i-2].t===w.t&&ws[i-3].t===w.t)); // remove loops
}
$('go').onclick=async()=>{
  const file=$('file').files[0];if(!file)return;
  $('go').disabled=true;S.wpc=+$('wpc').value;
  try{
    status('Reading audio…');$('pr').hidden=false;$('pr').removeAttribute('value');
    const audio=await prepAudio(file);
    await getAsr($('acc').value);
    $('pr').removeAttribute('value');
    status('Listening to the speech… this can take a few minutes. Keep this tab open.');
    words=clean(await transcribe(audio,$('lang').value));
    if(!words.length){status('No speech found. Try choosing the spoken language instead of Auto-detect.');$('go').disabled=false;$('pr').hidden=true;return}
    build();renderList();
    $('exp').disabled=false;$('srt').disabled=false;
    status(`Done: ${chunks.length} captions. Fix any wrong words below, then export.`);
  }catch(err){console.error(err);status("Couldn't read this video's audio. Try a shorter or smaller file.")}
  $('pr').hidden=true;$('go').disabled=false;
};

/* ---------- caption chunks + editor ---------- */
function build(){
  chunks=[];let cw=[];
  words.forEach((w,i)=>{
    cw.push({...w});const nx=words[i+1];
    const brk=cw.length>=S.wpc||!nx||nx.s-w.e>.7||(cw.length>=2&&/[.?!।,;]$/.test(w.t));
    if(brk){chunks.push({s:cw[0].s,e:Math.min(cw.at(-1).e+.3,nx?nx.s:1e9),ws:cw});cw=[]}
  });
}
function setText(c,txt){
  const arr=txt.trim().split(/\s+/).filter(Boolean);if(!arr.length)return;
  if(arr.length===c.ws.length)arr.forEach((t,i)=>c.ws[i].t=t);
  else{const a=c.ws[0].s,b=c.ws.at(-1).e,d=(b-a)/arr.length;c.ws=arr.map((t,i)=>({t,s:a+i*d,e:a+(i+1)*d}))}
}
const tf=s=>`${Math.floor(s/60)}:${(s%60).toFixed(1).padStart(4,'0')}`;
function renderList(){
  const L=$('list');L.innerHTML='';lastAct=-1;
  if(!chunks.length){L.innerHTML='<div class="empty">Captions will appear here after you generate them.</div>';return}
  chunks.forEach(c=>{
    const r=document.createElement('div');r.className='r';
    const tm=document.createElement('button');tm.textContent=tf(c.s);tm.onclick=()=>{v.pause();v.currentTime=c.s+S.delay+.02};
    const inp=document.createElement('input');inp.value=c.ws.map(w=>w.t).join(' ');inp.setAttribute('aria-label','Caption text');
    inp.oninput=()=>setText(c,inp.value);inp.onfocus=()=>{v.pause();v.currentTime=c.s+S.delay+.02};
    const x=document.createElement('button');x.textContent='✕';x.setAttribute('aria-label','Delete caption');
    x.onclick=()=>{chunks.splice(chunks.indexOf(c),1);renderList()};
    r.append(tm,inp,x);L.append(r);
  });
}

/* ---------- SRT ---------- */
const st=s=>{s=Math.max(0,s);const h=Math.floor(s/3600),m=Math.floor(s%3600/60),sec=Math.floor(s%60),ms=Math.round(s%1*1000);
  return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')},${String(ms).padStart(3,'0')}`};
$('srt').onclick=()=>{
  const txt=chunks.map((c,i)=>`${i+1}\n${st(c.s+S.delay)} --> ${st(c.e+S.delay)}\n${c.ws.map(w=>w.t).join(' ')}\n`).join('\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:'text/plain'}));a.download='captions.srt';a.click();
};

/* ---------- play + export ---------- */
function initAudio(){
  if(ac)return ac.resume();
  ac=new AudioContext();const src=ac.createMediaElementSource(v);
  dest=ac.createMediaStreamDestination();src.connect(dest);src.connect(ac.destination);
  return ac.resume();
}
$('play').onclick=async()=>{await initAudio();v.paused?v.play():v.pause()};
$('exp').onclick=async()=>{
  if(!cv.captureStream){status('Export is not supported in this browser. Use Chrome.');return}
  await initAudio();
  const stream=cv.captureStream(30);
  dest.stream.getAudioTracks().forEach(t=>stream.addTrack(t));
  const mime=['video/mp4;codecs=avc1','video/webm;codecs=vp9,opus','video/webm'].find(m=>MediaRecorder.isTypeSupported(m));
  const rec=new MediaRecorder(stream,{mimeType:mime,videoBitsPerSecond:8e6}),parts=[];
  rec.ondataavailable=e=>parts.push(e.data);
  rec.onstop=()=>{
    const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(parts,{type:mime}));
    a.download='captioned.'+(mime.includes('mp4')?'mp4':'webm');a.click();
    status('Exported. Check your downloads.');$('exp').disabled=false;
  };
  $('exp').disabled=true;v.pause();v.currentTime=0;
  await new Promise(r=>v.onseeked=r);
  await v.play();rec.start();
  v.onended=()=>{rec.stop();v.onended=null};
  status('Exporting in real time. Keep this tab open until it finishes.');
};
</script>
